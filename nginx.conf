# WP8: serves the Angular bundle and proxies the gateway-owned paths to the
# hcProfessionalGateway container (compose service "gateway", port 5505).
# TLS terminates at the host edge proxy (deploy/edge/), not here.
server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  # document uploads are capped at 5 MB server-side; allow headroom for the envelope
  client_max_body_size 8m;

  root /usr/share/nginx/html;

  # resolve the gateway lazily via Docker's embedded DNS so nginx starts even
  # if the gateway container is still booting
  resolver 127.0.0.11 valid=30s;
  set $gateway http://gateway:5505;

  location ~ ^/(api|services|management|auth|v3/api-docs|health)(/|$) {
    proxy_pass $gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # hashed build artifacts can be cached hard; index.html must not be
  location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "no-cache";
  }
}
