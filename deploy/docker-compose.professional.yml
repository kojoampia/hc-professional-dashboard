# WP8: the professional.abofonsa.com stack — web (nginx + Angular bundle),
# gateway (JWT issuer, routes /services/** via Consul), professionalService,
# and the shared infrastructure (Consul, MongoDB, Kafka).
#
# TLS terminates at the host edge proxy (see edge/professional.abofonsa.com.conf);
# only the web container is reachable from the host, bound to 127.0.0.1.
#
# Secrets and image coordinates come from .env (copy .env.example, then
# `openssl rand -base64 64` for JWT_BASE64_SECRET). The JWT signing key is
# resolved from the SAME env var in the gateway and the api — the two repos'
# application-prod.yml defaults differ, so the stack must always inject it.
name: hc-professional

services:
  web:
    image: ${REGISTRY_PREFIX:-}hc-professional-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:5503:80
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    image: ${REGISTRY_PREFIX:-}hc-professional-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      # Boot 4 renamed spring.data.mongodb.uri -> spring.mongodb.uri
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/hcProfessionalGateway
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - JWT_BASE64_SECRET=${JWT_BASE64_SECRET:?set JWT_BASE64_SECRET in .env (openssl rand -base64 64)}
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_BASE64_SECRET}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-https://professional.abofonsa.com}
      - JHIPSTER_MAIL_BASE_URL=${PORTAL_BASE_URL:-https://professional.abofonsa.com}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - SPRING_MAIL_HOST=${MAIL_HOST:-localhost}
      - SPRING_MAIL_PORT=${MAIL_PORT:-25}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
    # no host port: only web:80 is published; the gateway is reached through it
    healthcheck:
      # the Jib/Temurin image has no curl; bash /dev/tcp does the HTTP probe
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/5505 && printf 'GET /management/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      mongodb:
        condition: service_healthy
      consul:
        condition: service_started
      kafka:
        condition: service_started

  professionalservice:
    image: ${REGISTRY_PREFIX:-}hc-professional-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/professionalService
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9092
      - JWT_BASE64_SECRET=${JWT_BASE64_SECRET}
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_BASE64_SECRET}
    healthcheck:
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /management/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      mongodb:
        condition: service_healthy
      consul:
        condition: service_started
      kafka:
        condition: service_started

  consul:
    # official image — bitnami/consul was withdrawn from Docker Hub in 2025
    image: hashicorp/consul:1.18
    restart: unless-stopped
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    volumes:
      - ./central-server-config:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500

  mongodb:
    image: mongo:7.0.6
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

volumes:
  mongodb-data:
