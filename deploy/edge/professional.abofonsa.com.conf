# Host-level nginx server block for professional.abofonsa.com (WP8).
# Install to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then obtain the certificate:
#   sudo certbot --nginx -d professional.abofonsa.com
# (certbot rewrites the ssl_certificate lines below to the live paths)

server {
  listen 80;
  listen [::]:80;
  server_name professional.abofonsa.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name professional.abofonsa.com;

  ssl_certificate /etc/letsencrypt/live/professional.abofonsa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/professional.abofonsa.com/privkey.pem;

  # match the stack's upload ceiling (5 MB documents + multipart envelope)
  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:5503;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
