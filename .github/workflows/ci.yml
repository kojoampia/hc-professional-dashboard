# Quality gate for every pull request and every push to main.
#
# The counterpart to release.yml, which says of itself: "No quality gate here — this builds and
# pushes; it does not run the test suite." That has been the whole of this repository's CI, so a
# pull request could turn every screen blank and merge green.
#
# It is not hypothetical. On the day this was written, `prettier:check` had been failing on main for
# some time and nothing said so, and the application rendered completely unstyled behind any real
# Content-Security-Policy — both found by hand, both the kind of thing a gate notices immediately.
#
# No secrets are used, deliberately, so this runs on a fork's pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 22 rather than the `>=18.18.2` in engines: that floor is what the app runs on, not what it
      # is developed against, and pinning here keeps CI from drifting onto whatever ubuntu-latest
      # ships next. The mobile repo pins the same major from its .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Checked, never applied. A job that reformats and pushes turns review into a moving target.
      - name: Check formatting
        run: npm run prettier:check

      # `ng build`, not `tsc`. Unrouted files are never type-checked by tsc alone — an entity
      # component nothing routes to compiles as dead code and fails only when someone routes it.
      # web/CLAUDE.md names this explicitly.
      #
      # THIS RUNS BEFORE `npm test`, AND THE ORDER IS LOAD-BEARING — docs/backlog.md item 160.
      # `catalogues.spec.ts` checks its model of MergeJsonWebpackPlugin against what the plugin
      # actually emitted, which needs target/classes/static/i18n to exist; a job starts from a fresh
      # `npm ci` checkout, so while this step came *after* the tests those four cases skipped on every
      # single CI run, printing a warning inside a green build that nobody read. That is the same
      # ordering fault as the one recorded at the bottom of this file, found again three items later.
      #
      # MEASURED COST, run 35353786345 (the last run of the old order): this build took 46.8 s and
      # `npm test` 57.6 s. On a green run the job total is unchanged — the same two steps in the other
      # order. What is paid is FEEDBACK LATENCY ON A RED RUN: a failing test now reports ~47 s later,
      # and in exchange a failing build reports ~58 s earlier. Both directions were weighed; a broken
      # build is the cheaper thing to be told about first, and the four cases are the only check in
      # this repository that looks at the i18n the browser is actually served.
      - name: Production build
        run: npm run webapp:prod

      # Everything below runs against the ARTEFACT. Each guards a failure that compiles, tests green
      # and is invisible to the type checker.
      - name: Check the built output
        run: node scripts/check-build-output.mjs

      # `npm test` here is `ng test --coverage -w=2`. The worker cap matters on a two-core runner:
      # Jest's default of one worker per core swaps and then times out.
      #
      # Also an artefact check, since item 160: `catalogues.spec.ts` compares the four built
      # catalogues above against its own model of the merge. It FAILS rather than skips whenever CI is
      # set and that output is absent, so moving this step back above the build does not quietly
      # disarm it — it reddens, naming this file. Do not "fix" such a failure by unsetting CI.
      - name: Test
        run: npm test

      # Four languages are a shipping condition, and ngx-translate gives no runtime signal when a key
      # is missing — it renders the key itself. **That is asserted by `catalogues.spec.ts` inside
      # `npm test` above**, per locale and per file, with no baseline.
      #
      # There was a second check here until docs/backlog.md item 101 — `scripts/check-i18n-parity.mjs`,
      # asserting the same key parity with a baseline. It ran at this point in the same job, *after*
      # `npm test`, so drift failed Jest and this step was never reached. A recorded allowance could
      # therefore never buy a green build, and no future drift could be baselined either: recording it
      # would first require making `catalogues.spec.ts` pass, i.e. having no drift to record. Item 26
      # deleted the baseline for that reason; item 101 deleted the script that read it.
      #
      # What was lost, recorded so nobody rediscovers it as a gap: the script needed no Jest and no
      # `node_modules`, so it was the only way to check parity on a machine that could not build the
      # app. If that is wanted again, it wants to run *before* `npm test` to mean anything.
