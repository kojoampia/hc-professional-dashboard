<div class="flex justify-center">
  <div class="">
    @if (recommendation(); as recommendationRef) {
    <div>
      <h2 data-cy="recommendationDetailsHeading">
        <span jhiTranslate="professionalDashboardApp.patientserviceRecommendation.detail.title">Recommendation</span>
      </h2>

      <hr />

      <hpd-alert-error />

      <hpd-alert />

      <dl class="grid gap-4-md jh-entity-details">
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceRecommendation.id">Id</span></dt>
        <dd>
          <span>{{ recommendationRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceRecommendation.label">Label</span></dt>
        <dd>
          <span>{{ recommendationRef.label }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceRecommendation.category">Category</span></dt>
        <dd>
          <span>{{ recommendationRef.category }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="hpd-btn hpd-btn-ghost" data-cy="entityDetailsBackButton">
        <mat-icon aria-hidden="true" class="!text-base">arrow_back</mat-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/recommendation', recommendationRef.id, 'edit']" class="hpd-btn hpd-btn-primary">
        <mat-icon aria-hidden="true" class="!text-base">edit</mat-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
