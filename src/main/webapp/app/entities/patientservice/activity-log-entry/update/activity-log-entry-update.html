<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-activity-log-entry-heading"
        data-cy="ActivityLogEntryCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.home.createOrEditLabel"
      >
        Create or edit a Activity Log Entry
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_patientId" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.patientId"
            >Patient Id</label
          >
          <input type="text" class="hpd-input" name="patientId" id="field_patientId" data-cy="patientId" formControlName="patientId" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_occurredAt" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.occurredAt"
            >Occurred At</label
          >
          <div class="flex">
            <input
              id="field_occurredAt"
              data-cy="occurredAt"
              type="datetime-local"
              class="hpd-input"
              name="occurredAt"
              formControlName="occurredAt"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_label" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.label"
            >Label</label
          >
          <input type="text" class="hpd-input" name="label" id="field_label" data-cy="label" formControlName="label" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_title" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.title"
            >Title</label
          >
          <input type="text" class="hpd-input" name="title" id="field_title" data-cy="title" formControlName="title" />
        </div>

        <div class="mb-3">
          <label
            class="hpd-label"
            for="field_description"
            jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.description"
            >Description</label
          >
          <input
            type="text"
            class="hpd-input"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdAt" jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.createdAt"
            >Created At</label
          >
          <div class="flex">
            <input
              id="field_createdAt"
              data-cy="createdAt"
              type="datetime-local"
              class="hpd-input"
              name="createdAt"
              formControlName="createdAt"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
