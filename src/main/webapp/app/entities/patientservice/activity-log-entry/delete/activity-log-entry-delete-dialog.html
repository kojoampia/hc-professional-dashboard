@if (activityLogEntry) {
<form name="deleteForm" (ngSubmit)="confirmDelete(activityLogEntry.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="activityLogEntryDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
  </div>

  <div class="modal-body">
    <hpd-alert-error />
    <p
      id="hpd-delete-activityLogEntry-heading"
      jhiTranslate="professionalDashboardApp.patientserviceActivityLogEntry.delete.question"
      [translateValues]="{ id: activityLogEntry.id }"
    >
      Are you sure you want to delete Activity Log Entry {{ activityLogEntry.id }}?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="hpd-btn hpd-btn-ghost" data-dismiss="modal" (click)="cancel()">
      <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>

    <button id="hpd-confirm-delete-activityLogEntry" data-cy="entityConfirmDeleteButton" type="submit" class="hpd-btn hpd-btn-danger">
      <mat-icon aria-hidden="true" class="!text-base">close</mat-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
    </button>
  </div>
</form>
}
