<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-clinical-report-heading"
        data-cy="ClinicalReportCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.home.createOrEditLabel"
      >
        Create or edit a Clinical Report
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_patientId" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.patientId"
            >Patient Id</label
          >
          <input type="text" class="hpd-input" name="patientId" id="field_patientId" data-cy="patientId" formControlName="patientId" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_occurredAt" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.occurredAt"
            >Occurred At</label
          >
          <div class="flex">
            <input
              id="field_occurredAt"
              data-cy="occurredAt"
              type="datetime-local"
              class="hpd-input"
              name="occurredAt"
              formControlName="occurredAt"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_label" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.label"
            >Label</label
          >
          <input type="text" class="hpd-input" name="label" id="field_label" data-cy="label" formControlName="label" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_reportType" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.reportType"
            >Report Type</label
          >
          <input
            type="text"
            class="hpd-input"
            name="reportType"
            id="field_reportType"
            data-cy="reportType"
            formControlName="reportType"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_url" jhiTranslate="professionalDashboardApp.patientserviceClinicalReport.url">Url</label>
          <input type="text" class="hpd-input" name="url" id="field_url" data-cy="url" formControlName="url" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
