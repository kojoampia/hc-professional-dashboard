<div class="flex justify-center">
  <div class="">
    @if (medicationRecord(); as medicationRecordRef) {
    <div>
      <h2 data-cy="medicationRecordDetailsHeading">
        <span jhiTranslate="professionalDashboardApp.patientserviceMedicationRecord.detail.title">Medication Record</span>
      </h2>

      <hr />

      <hpd-alert-error />

      <hpd-alert />

      <dl class="grid gap-4-md jh-entity-details">
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceMedicationRecord.id">Id</span></dt>
        <dd>
          <span>{{ medicationRecordRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceMedicationRecord.patientId">Patient Id</span></dt>
        <dd>
          <span>{{ medicationRecordRef.patientId }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceMedicationRecord.occurredAt">Occurred At</span></dt>
        <dd>
          <span>{{ medicationRecordRef.occurredAt | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.patientserviceMedicationRecord.label">Label</span></dt>
        <dd>
          <span>{{ medicationRecordRef.label }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="hpd-btn hpd-btn-ghost" data-cy="entityDetailsBackButton">
        <mat-icon aria-hidden="true" class="!text-base">arrow_back</mat-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/medication-record', medicationRecordRef.id, 'edit']" class="hpd-btn hpd-btn-primary">
        <mat-icon aria-hidden="true" class="!text-base">edit</mat-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
