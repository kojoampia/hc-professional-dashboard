<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-stat-heading"
        data-cy="StatCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.professionalServiceStat.home.createOrEditLabel"
      >
        Create or edit a Stat
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.professionalServiceStat.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_type" jhiTranslate="professionalDashboardApp.professionalServiceStat.type">Type</label>
          <input type="text" class="hpd-input" name="type" id="field_type" data-cy="type" formControlName="type" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_name" jhiTranslate="professionalDashboardApp.professionalServiceStat.name">Name</label>
          <input type="text" class="hpd-input" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_description" jhiTranslate="professionalDashboardApp.professionalServiceStat.description"
            >Description</label
          >
          <input
            type="text"
            class="hpd-input"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_value" jhiTranslate="professionalDashboardApp.professionalServiceStat.value">Value</label>
          <input type="number" class="hpd-input" name="value" id="field_value" data-cy="value" formControlName="value" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_note" jhiTranslate="professionalDashboardApp.professionalServiceStat.note">Note</label>
          <input type="text" class="hpd-input" name="note" id="field_note" data-cy="note" formControlName="note" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdDate" jhiTranslate="professionalDashboardApp.professionalServiceStat.createdDate"
            >Created Date</label
          >
          <div class="input-group">
            <input
              id="field_createdDate"
              data-cy="createdDate"
              type="date"
              class="hpd-input"
              name="createdDate"
              formControlName="createdDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdBy" jhiTranslate="professionalDashboardApp.professionalServiceStat.createdBy"
            >Created By</label
          >
          <input type="text" class="hpd-input" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
