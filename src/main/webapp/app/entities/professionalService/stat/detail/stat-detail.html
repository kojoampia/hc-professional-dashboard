<div class="flex justify-center">
  <div class="">
    @if (stat(); as statRef) {
    <div>
      <h2 data-cy="statDetailsHeading"><span jhiTranslate="professionalDashboardApp.professionalServiceStat.detail.title">Stat</span></h2>

      <hr />

      <hpd-alert-error />

      <hpd-alert />

      <dl class="grid gap-4-md jh-entity-details">
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.id">Id</span></dt>
        <dd>
          <span>{{ statRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.type">Type</span></dt>
        <dd>
          <span>{{ statRef.type }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.name">Name</span></dt>
        <dd>
          <span>{{ statRef.name }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.description">Description</span></dt>
        <dd>
          <span>{{ statRef.description }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.value">Value</span></dt>
        <dd>
          <span>{{ statRef.value }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.note">Note</span></dt>
        <dd>
          <span>{{ statRef.note }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.createdDate">Created Date</span></dt>
        <dd>
          <span>{{ statRef.createdDate | formatMediumDate }}</span>
        </dd>
        <dt><span jhiTranslate="professionalDashboardApp.professionalServiceStat.createdBy">Created By</span></dt>
        <dd>
          <span>{{ statRef.createdBy }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="hpd-btn hpd-btn-ghost" data-cy="entityDetailsBackButton">
        <mat-icon aria-hidden="true" class="!text-base">arrow_back</mat-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/stat', statRef.id, 'edit']" class="hpd-btn hpd-btn-primary">
        <mat-icon aria-hidden="true" class="!text-base">edit</mat-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
