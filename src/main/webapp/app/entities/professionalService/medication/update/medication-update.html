<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-medication-heading"
        data-cy="MedicationCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.professionalServiceMedication.home.createOrEditLabel"
      >
        Create or edit a Medication
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="form-label" for="field_id" jhiTranslate="professionalDashboardApp.professionalServiceMedication.id">Id</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_name" jhiTranslate="professionalDashboardApp.professionalServiceMedication.name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="mb-3">
          <label
            class="form-label"
            for="field_description"
            jhiTranslate="professionalDashboardApp.professionalServiceMedication.description"
            >Description</label
          >
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label
            class="form-label"
            for="field_prescription"
            jhiTranslate="professionalDashboardApp.professionalServiceMedication.prescription"
            >Prescription</label
          >
          <input
            type="text"
            class="form-control"
            name="prescription"
            id="field_prescription"
            data-cy="prescription"
            formControlName="prescription"
          />
        </div>

        <div class="mb-3">
          <label
            class="form-label"
            for="field_createdDate"
            jhiTranslate="professionalDashboardApp.professionalServiceMedication.createdDate"
            >Created Date</label
          >
          <div class="input-group">
            <input
              id="field_createdDate"
              data-cy="createdDate"
              type="date"
              class="form-control"
              name="createdDate"
              formControlName="createdDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label
            class="form-label"
            for="field_modifiedDate"
            jhiTranslate="professionalDashboardApp.professionalServiceMedication.modifiedDate"
            >Modified Date</label
          >
          <div class="input-group">
            <input
              id="field_modifiedDate"
              data-cy="modifiedDate"
              type="date"
              class="form-control"
              name="modifiedDate"
              formControlName="modifiedDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_createdBy" jhiTranslate="professionalDashboardApp.professionalServiceMedication.createdBy"
            >Created By</label
          >
          <input type="text" class="form-control" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_modifiedBy" jhiTranslate="professionalDashboardApp.professionalServiceMedication.modifiedBy"
            >Modified By</label
          >
          <input
            type="text"
            class="form-control"
            name="modifiedBy"
            id="field_modifiedBy"
            data-cy="modifiedBy"
            formControlName="modifiedBy"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
