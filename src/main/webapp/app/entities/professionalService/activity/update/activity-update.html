<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-activity-heading"
        data-cy="ActivityCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.professionalServiceActivity.home.createOrEditLabel"
      >
        Create or edit a Activity
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.professionalServiceActivity.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_name" jhiTranslate="professionalDashboardApp.professionalServiceActivity.name">Name</label>
          <input type="text" class="hpd-input" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_description" jhiTranslate="professionalDashboardApp.professionalServiceActivity.description"
            >Description</label
          >
          <input
            type="text"
            class="hpd-input"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_patientId" jhiTranslate="professionalDashboardApp.professionalServiceActivity.patientId"
            >Patient Id</label
          >
          <input type="text" class="hpd-input" name="patientId" id="field_patientId" data-cy="patientId" formControlName="patientId" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdDate" jhiTranslate="professionalDashboardApp.professionalServiceActivity.createdDate"
            >Created Date</label
          >
          <div class="flex">
            <input
              id="field_createdDate"
              data-cy="createdDate"
              type="datetime-local"
              class="hpd-input"
              name="createdDate"
              formControlName="createdDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdBy" jhiTranslate="professionalDashboardApp.professionalServiceActivity.createdBy"
            >Created By</label
          >
          <input type="text" class="hpd-input" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="mb-3">
          <label
            class="hpd-label"
            for="field_modifiedDate"
            jhiTranslate="professionalDashboardApp.professionalServiceActivity.modifiedDate"
            >Modified Date</label
          >
          <div class="flex">
            <input
              id="field_modifiedDate"
              data-cy="modifiedDate"
              type="datetime-local"
              class="hpd-input"
              name="modifiedDate"
              formControlName="modifiedDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_modifiedBy" jhiTranslate="professionalDashboardApp.professionalServiceActivity.modifiedBy"
            >Modified By</label
          >
          <input
            type="text"
            class="hpd-input"
            name="modifiedBy"
            id="field_modifiedBy"
            data-cy="modifiedBy"
            formControlName="modifiedBy"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
