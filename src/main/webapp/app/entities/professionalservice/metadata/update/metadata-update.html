<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-metadata-heading"
        data-cy="MetadataCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.professionalserviceMetadata.home.createOrEditLabel"
      >
        Create or edit a Metadata
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_createdBy" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.createdBy"
            >Created By</label
          >
          <input type="text" class="hpd-input" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_modifiedBy" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.modifiedBy"
            >Modified By</label
          >
          <input type="text" class="hpd-input" name="modifiedBy" id="field_modifiedBy" data-cy="modifiedBy" formControlName="modifiedBy" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdDate" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.createdDate"
            >Created Date</label
          >
          <div class="input-group">
            <input
              id="field_createdDate"
              data-cy="createdDate"
              type="date"
              class="hpd-input"
              name="createdDate"
              formControlName="createdDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_modifiedDate" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.modifiedDate"
            >Modified Date</label
          >
          <div class="input-group">
            <input
              id="field_modifiedDate"
              data-cy="modifiedDate"
              type="date"
              class="hpd-input"
              name="modifiedDate"
              formControlName="modifiedDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_data" jhiTranslate="professionalDashboardApp.professionalserviceMetadata.data">Data</label>
          <input type="text" class="hpd-input" name="data" id="field_data" data-cy="data" formControlName="data" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
