<div class="flex justify-center">
  <div class="">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-task-heading"
        data-cy="TaskCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.professionalserviceTask.home.createOrEditLabel"
      >
        Create or edit a Task
      </h2>

      <div>
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {

        <div class="mb-3">
          <label class="hpd-label" for="field_id" jhiTranslate="professionalDashboardApp.professionalserviceTask.id">Id</label>
          <input type="text" class="hpd-input" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
        }

        <div class="mb-3">
          <label class="hpd-label" for="field_name" jhiTranslate="professionalDashboardApp.professionalserviceTask.name">Name</label>
          <input type="text" class="hpd-input" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_description" jhiTranslate="professionalDashboardApp.professionalserviceTask.description"
            >Description</label
          >
          <input
            type="text"
            class="hpd-input"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_schedule" jhiTranslate="professionalDashboardApp.professionalserviceTask.schedule"
            >Schedule</label
          >
          <div class="input-group">
            <input id="field_schedule" data-cy="schedule" type="date" class="hpd-input" name="schedule" formControlName="schedule" />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_duration" jhiTranslate="professionalDashboardApp.professionalserviceTask.duration"
            >Duration</label
          >
          <input type="number" class="hpd-input" name="duration" id="field_duration" data-cy="duration" formControlName="duration" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_attendantId" jhiTranslate="professionalDashboardApp.professionalserviceTask.attendantId"
            >Attendant Id</label
          >
          <input
            type="text"
            class="hpd-input"
            name="attendantId"
            id="field_attendantId"
            data-cy="attendantId"
            formControlName="attendantId"
          />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_teamId" jhiTranslate="professionalDashboardApp.professionalserviceTask.teamId">Team Id</label>
          <input type="text" class="hpd-input" name="teamId" id="field_teamId" data-cy="teamId" formControlName="teamId" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_patientId" jhiTranslate="professionalDashboardApp.professionalserviceTask.patientId"
            >Patient Id</label
          >
          <input type="text" class="hpd-input" name="patientId" id="field_patientId" data-cy="patientId" formControlName="patientId" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdDate" jhiTranslate="professionalDashboardApp.professionalserviceTask.createdDate"
            >Created Date</label
          >
          <div class="input-group">
            <input
              id="field_createdDate"
              data-cy="createdDate"
              type="date"
              class="hpd-input"
              name="createdDate"
              formControlName="createdDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_modifiedDate" jhiTranslate="professionalDashboardApp.professionalserviceTask.modifiedDate"
            >Modified Date</label
          >
          <div class="input-group">
            <input
              id="field_modifiedDate"
              data-cy="modifiedDate"
              type="date"
              class="hpd-input"
              name="modifiedDate"
              formControlName="modifiedDate"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_createdBy" jhiTranslate="professionalDashboardApp.professionalserviceTask.createdBy"
            >Created By</label
          >
          <input type="text" class="hpd-input" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="mb-3">
          <label class="hpd-label" for="field_modifiedBy" jhiTranslate="professionalDashboardApp.professionalserviceTask.modifiedBy"
            >Modified By</label
          >
          <input type="text" class="hpd-input" name="modifiedBy" id="field_modifiedBy" data-cy="modifiedBy" formControlName="modifiedBy" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="hpd-btn hpd-btn-ghost" (click)="previousState()">
          <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="hpd-btn hpd-btn-primary"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
