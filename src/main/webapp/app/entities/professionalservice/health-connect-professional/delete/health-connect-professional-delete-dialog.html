@if (healthConnectProfessional) {
<form name="deleteForm" (ngSubmit)="confirmDelete(healthConnectProfessional.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="healthConnectProfessionalDeleteDialogHeading" jhiTranslate="entity.delete.title">
      Confirm delete operation
    </h4>
  </div>

  <div class="modal-body">
    <hpd-alert-error />
    <p
      id="hpd-delete-healthConnectProfessional-heading"
      jhiTranslate="professionalDashboardApp.professionalserviceHealthConnectProfessional.delete.question"
      [translateValues]="{ id: healthConnectProfessional.id }"
    >
      Are you sure you want to delete Health Connect Professional {{ healthConnectProfessional.id }}?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="hpd-btn hpd-btn-ghost" data-dismiss="modal" (click)="cancel()">
      <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>

    <button id="hpd-confirm-delete-healthConnectProfessional" data-cy="entityConfirmDeleteButton" type="submit" class="hpd-btn hpd-btn-danger">
      <mat-icon aria-hidden="true" class="!text-base">close</mat-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
    </button>
  </div>
</form>
}
