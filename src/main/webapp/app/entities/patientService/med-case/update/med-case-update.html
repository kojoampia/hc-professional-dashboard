<div class="mx-auto max-w-2xl px-4 py-8">
  <div class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="hpd-med-case-heading"
        class="mb-6 text-lg font-bold text-slate-900"
        data-cy="MedCaseCreateUpdateHeading"
        jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.home.createOrEditLabel"
      >
        Create or edit a Med Case
      </h2>

      <div class="grid gap-4">
        <hpd-alert-error />

        @if (editForm.controls.id.value !== null) {
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700" for="field_id" jhiTranslate="global.field.id">ID</label>
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-500"
            type="text"
            name="id"
            id="field_id"
            data-cy="id"
            formControlName="id"
            [readonly]="true"
          />
        </div>
        }

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_symptoms"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.symptoms"
            >Symptoms</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            type="text"
            name="symptoms"
            id="field_symptoms"
            data-cy="symptoms"
            formControlName="symptoms"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_diagnoses"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.diagnoses"
            >Diagnoses</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            type="text"
            name="diagnoses"
            id="field_diagnoses"
            data-cy="diagnoses"
            formControlName="diagnoses"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_recommendations"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.recommendations"
            >Recommendations</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            type="text"
            name="recommendations"
            id="field_recommendations"
            data-cy="recommendations"
            formControlName="recommendations"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_createdDate"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.createdDate"
            >Created Date</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            id="field_createdDate"
            data-cy="createdDate"
            type="datetime-local"
            name="createdDate"
            formControlName="createdDate"
            placeholder="YYYY-MM-DD HH:mm"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_createdBy"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.createdBy"
            >Created By</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            type="text"
            name="createdBy"
            id="field_createdBy"
            data-cy="createdBy"
            formControlName="createdBy"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_modifiedDate"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.modifiedDate"
            >Modified Date</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            id="field_modifiedDate"
            data-cy="modifiedDate"
            type="datetime-local"
            name="modifiedDate"
            formControlName="modifiedDate"
            placeholder="YYYY-MM-DD HH:mm"
          />
        </div>

        <div>
          <label
            class="mb-1 block text-sm font-medium text-slate-700"
            for="field_modifiedBy"
            jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.modifiedBy"
            >Modified By</label
          >
          <input
            class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
            type="text"
            name="modifiedBy"
            id="field_modifiedBy"
            data-cy="modifiedBy"
            formControlName="modifiedBy"
          />
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button
          class="hpd-focusable flex items-center gap-1 rounded-full bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200"
          type="button"
          id="cancel-save"
          data-cy="entityCreateCancelButton"
          (click)="previousState()"
        >
          <mat-icon aria-hidden="true" class="!text-base">close</mat-icon>
          <span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          class="hpd-focusable flex items-center gap-1 rounded-full bg-hpd-primary px-4 py-2 text-sm font-medium text-white hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50"
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
        >
          <mat-icon aria-hidden="true" class="!text-base">save</mat-icon>
          <span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
