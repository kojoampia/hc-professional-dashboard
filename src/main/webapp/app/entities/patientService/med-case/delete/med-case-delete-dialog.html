@if (medCase) {
<form name="deleteForm" (ngSubmit)="confirmDelete(medCase.id!)">
  <div class="border-b border-hpd-border bg-hpd-cream/50 px-6 py-4">
    <h4 class="m-0 text-lg font-bold text-hpd-primary-dark" data-cy="medCaseDeleteDialogHeading" jhiTranslate="entity.delete.title">
      Confirm delete operation
    </h4>
  </div>

  <div class="px-6 py-5">
    <hpd-alert-error />
    <p
      id="hpd-delete-medCase-heading"
      class="m-0 text-sm text-hpd-muted"
      jhiTranslate="professionalDashboardApp.hcPatientServiceMedCase.delete.question"
      [translateValues]="{ id: medCase.id }"
    >
      Are you sure you want to delete Med Case {{ medCase.id }}?
    </p>
  </div>

  <div class="flex justify-end gap-2 border-t border-hpd-border px-6 py-4">
    <button
      class="hpd-focusable flex items-center gap-1 rounded-full bg-hpd-cream px-4 py-2 text-sm font-medium text-hpd-primary-dark hover:bg-hpd-cream"
      type="button"
      (click)="cancel()"
    >
      <mat-icon aria-hidden="true" class="!text-base">close</mat-icon>
      <span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>

    <button
      id="hpd-confirm-delete-medCase"
      class="hpd-focusable flex items-center gap-1 rounded-full bg-hpd-danger px-4 py-2 text-sm font-medium text-white hover:brightness-95"
      data-cy="entityConfirmDeleteButton"
      type="submit"
    >
      <mat-icon aria-hidden="true" class="!text-base">delete</mat-icon>
      <span jhiTranslate="entity.action.delete">Delete</span>
    </button>
  </div>
</form>
}
