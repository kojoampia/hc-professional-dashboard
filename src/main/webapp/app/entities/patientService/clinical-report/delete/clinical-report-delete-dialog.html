@if (clinicalReport) {
<form name="deleteForm" (ngSubmit)="confirmDelete(clinicalReport.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="clinicalReportDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
  </div>

  <div class="modal-body">
    <hpd-alert-error />
    <p
      id="hpd-delete-clinicalReport-heading"
      jhiTranslate="professionalDashboardApp.patientServiceClinicalReport.delete.question"
      [translateValues]="{ id: clinicalReport.id }"
    >
      Are you sure you want to delete Clinical Report {{ clinicalReport.id }}?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
      <mat-icon aria-hidden="true" class="!text-base">cancel</mat-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>

    <button id="hpd-confirm-delete-clinicalReport" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <mat-icon aria-hidden="true" class="!text-base">close</mat-icon>&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
    </button>
  </div>
</form>
}
