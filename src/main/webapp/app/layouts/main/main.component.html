<!--
  A mount point, not a layout. The route chooses its own chrome: AuthShellComponent for the
  signed-out screens and ShellComponent for the portal, so the sidebar cannot appear in front of
  a visitor who has nowhere to navigate to.

  The ribbon and the toast outlet stay here because they belong to every screen — a toast raised
  by a failed sign-in has to render on the sign-in page, which is not inside either shell.
-->
<router-outlet></router-outlet>
