<div class="mx-auto flex min-h-[60vh] max-w-md flex-col justify-center px-4 py-12">
  <div class="rounded-2xl border border-slate-100 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-xl font-bold text-slate-900" jhiTranslate="login.title" data-cy="loginTitle">Sign in</h1>
    @if (authenticationError) {
      <div
        class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"
        jhiTranslate="login.messages.error.authentication"
        data-cy="loginError"
      >
        <strong>Failed to sign in!</strong> Please check your credentials and try again.
      </div>
    }
    <form class="grid gap-4" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
      <div>
        <label class="username-label mb-1 block text-sm font-medium text-slate-700" for="username" jhiTranslate="global.form.username.label"
          >Username</label
        >
        <input
          class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
          type="text"
          name="username"
          id="username"
          placeholder="{{ 'global.form.username.placeholder' | translate }}"
          formControlName="username"
          #username
          data-cy="username"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="password" jhiTranslate="login.form.password">Password</label>
        <input
          class="hpd-focusable w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm"
          type="password"
          name="password"
          id="password"
          placeholder="{{ 'login.form.password.placeholder' | translate }}"
          formControlName="password"
          data-cy="password"
        />
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-600" for="rememberMe">
        <input
          class="hpd-focusable h-4 w-4 rounded border-slate-300 accent-hpd-primary"
          type="checkbox"
          name="rememberMe"
          id="rememberMe"
          formControlName="rememberMe"
        />
        <span jhiTranslate="login.form.rememberme">Remember me</span>
      </label>

      <button
        class="hpd-focusable rounded-full bg-hpd-primary px-4 py-2 text-sm font-medium text-white hover:brightness-110"
        type="submit"
        jhiTranslate="login.form.button"
        data-cy="submit"
      >
        Sign in
      </button>
    </form>

    <div class="mt-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
      <a
        class="hpd-focusable font-medium underline"
        routerLink="/account/reset/request"
        jhiTranslate="login.password.forgot"
        data-cy="forgetYourPasswordSelector"
        >Did you forget your password?</a
      >
    </div>

    <div class="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
      <span jhiTranslate="global.messages.info.register.noaccount">You don&apos;t have an account yet?</span>
      <a class="hpd-focusable font-medium underline" routerLink="/account/register" jhiTranslate="global.messages.info.register.link"
        >Register a new account</a
      >
    </div>
  </div>
</div>
