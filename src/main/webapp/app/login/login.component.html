<!--
  The form only. AuthShellComponent supplies the frame — brand panel on the left, this on the
  right — and shares it with registration, activation and password reset so the four cannot
  drift apart.

  This template used to carry its own copy of that panel. When the shell was extracted the copy
  was left behind, and the sign-in page rendered TWO brand panels with the form crushed beside
  them. Nothing caught it: the suite, lint and all three build-artefact checks were green, and it
  is only visible to an eye on the page.
-->
<h1 class="mb-1.5 text-2xl font-extrabold tracking-tight text-hpd-primary-dark" jhiTranslate="login.title" data-cy="loginTitle">Sign in</h1>
<p class="mb-6 text-[14.5px] text-hpd-muted" jhiTranslate="healthConnect.brand.signInHint">Sign in to your clinician account.</p>
@if (authenticationError) {
  <div
    class="mb-4 rounded-hpd-sm border border-hpd-danger/25 bg-hpd-danger-tint px-4 py-3 text-sm text-hpd-danger"
    jhiTranslate="login.messages.error.authentication"
    data-cy="loginError"
  >
    <strong>Failed to sign in!</strong> Please check your credentials and try again.
  </div>
}
<form class="grid gap-3.5" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
  <div>
    <label class="username-label hpd-label" for="username" jhiTranslate="global.form.username.label">Username</label>
    <input
      class="hpd-focusable hpd-input"
      type="text"
      name="username"
      id="username"
      placeholder="{{ 'global.form.username.placeholder' | translate }}"
      formControlName="username"
      #username
      data-cy="username"
    />
  </div>

  <div>
    <label class="hpd-label" for="password" jhiTranslate="login.form.password">Password</label>
    <input
      class="hpd-focusable hpd-input"
      type="password"
      name="password"
      id="password"
      placeholder="{{ 'login.form.password.placeholder' | translate }}"
      formControlName="password"
      data-cy="password"
    />
  </div>

  <label class="flex items-center gap-2 text-sm text-hpd-muted" for="rememberMe">
    <input
      class="hpd-focusable h-4 w-4 rounded border-hpd-border accent-hpd-primary"
      type="checkbox"
      name="rememberMe"
      id="rememberMe"
      formControlName="rememberMe"
    />
    <span jhiTranslate="login.form.rememberme">Remember me</span>
  </label>

  <button class="hpd-focusable hpd-btn hpd-btn-primary mt-1.5 w-full" type="submit" jhiTranslate="login.form.button" data-cy="submit">
    Sign in
  </button>
</form>

<div class="mt-5 rounded-hpd-sm border border-[#eedfb9] bg-hpd-gold-tint px-3.5 py-3 text-[12.5px] text-hpd-muted">
  <a
    class="hpd-focusable font-bold text-hpd-primary underline"
    routerLink="/account/reset/request"
    jhiTranslate="login.password.forgot"
    data-cy="forgetYourPasswordSelector"
    >Did you forget your password?</a
  >
</div>

<div class="mt-3 rounded-hpd-sm border border-[#eedfb9] bg-hpd-gold-tint px-3.5 py-3 text-[12.5px] text-hpd-muted">
  <span jhiTranslate="global.messages.info.register.noaccount">You don&apos;t have an account yet?</span>
  <a
    class="hpd-focusable font-bold text-hpd-primary underline"
    routerLink="/account/register"
    jhiTranslate="global.messages.info.register.link"
    >Register a new account</a
  >
</div>
