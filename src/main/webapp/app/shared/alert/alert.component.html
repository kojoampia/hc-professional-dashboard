<div class="alerts fixed inset-x-0 top-4 z-50 mx-auto flex max-w-md flex-col gap-2 px-4" role="alert">
  @for (alert of bannerAlerts; track $index) {
    <div [ngClass]="setClasses(alert)">
      @if (alert.message) {
        <div class="flex items-start gap-3 rounded-lg border px-4 py-3 shadow-sm" [class]="alertTypeClasses(alert.type)">
          <pre class="m-0 flex-1 whitespace-pre-wrap font-sans text-sm" [innerHTML]="alert.message"></pre>
          <button
            class="hpd-focusable text-current opacity-60 transition-opacity hover:opacity-100"
            type="button"
            [attr.aria-label]="'healthConnect.actions.close' | translate"
            (click)="close(alert)"
          >
            <mat-icon aria-hidden="true" class="!text-lg">close</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
