<div class="mx-auto flex min-h-[60vh] max-w-2xl flex-col justify-center px-4 py-12">
  <div class="rounded-2xl border border-slate-100 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-xl font-bold text-slate-900" jhiTranslate="activate.title">Activation</h1>
    @if (success) {
      <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
        <span jhiTranslate="activate.messages.success"><strong>Your user account has been activated.</strong> Please </span>
        <a class="font-medium underline" routerLink="/login" jhiTranslate="global.messages.info.authenticated.link">sign in</a>.
      </div>
    }
    @if (error) {
      <div class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" jhiTranslate="activate.messages.error">
        <strong>Your user could not be activated.</strong> Please use the registration form to sign up.
      </div>
    }
  </div>
</div>
