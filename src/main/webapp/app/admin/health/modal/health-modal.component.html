@if (health) {
  <h2 mat-dialog-title id="showHealthLabel">
    {{ 'health.indicator.' + health.key | translate }}
  </h2>
}

<mat-dialog-content>
  @if (health) {
    <div>
      <h3 class="mb-2 text-sm font-semibold text-hpd-primary-dark" jhiTranslate="health.details.properties">Properties</h3>

      <div class="overflow-x-auto rounded-hpd-sm border border-hpd-border">
        <table class="w-full text-left text-sm text-hpd-muted" aria-describedby="showHealthLabel">
          <thead class="bg-hpd-cream text-xs uppercase">
            <tr>
              <th scope="col" class="px-4 py-3 font-bold text-hpd-primary-dark" jhiTranslate="health.details.name">Name</th>
              <th scope="col" class="px-4 py-3 font-bold text-hpd-primary-dark" jhiTranslate="health.details.value">Value</th>
            </tr>
          </thead>
          <tbody>
            @for (healthDetail of health.value.details! | keyvalue; track healthDetail.key) {
              <tr class="border-t border-hpd-border">
                <td class="px-4 py-3">{{ healthDetail.key }}</td>
                <td class="px-4 py-3">{{ readableValue(healthDetail.value) }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="hpd-focusable" mat-button type="button" (click)="dismiss()">Done</button>
</mat-dialog-actions>
