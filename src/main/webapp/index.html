<!doctype html>
<html class="no-js" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Abofonsa BridgeCare Professional</title>
    <meta
      name="description"
      content="Abofonsa BridgeCare Professional — the clinician portal for Abofonsa BridgeCare home healthcare: patient records, clinical cases, duty rosters and credentialing in one place."
    />
    <!--
      Every surface here is behind authentication and the marketing entry point is
      web.abofonsa.com/careers, not this hostname, so the portal is withdrawn from search entirely.
      This tag is one of three layers and it is the one that stops *indexing*; robots.txt only stops
      crawling, and a Disallow'd URL can still be indexed from an inbound link. The other two are
      robots.txt and the X-Robots-Tag header in deploy/prod-server/professional.abofonsa.com.conf.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0d3058" />
    <base href="/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <!-- content/ is copied wholesale by angular.json's assets; root-level PNGs are NOT, so these
         must point here or they 404 in a production build. -->
    <link rel="icon" type="image/png" sizes="32x32" href="content/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="content/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="content/images/apple-icon-180x180.png" />
    <link rel="manifest" href="manifest.webapp" />
    <link rel="stylesheet" href="content/css/loading.css" />
    <!-- jhipster-needle-add-resources-to-root - JHipster will add new resources here -->
  </head>

  <body>
    <!--[if lt IE 9]>
      <p class="browserupgrade">
        You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->
    <hpd-app>
      <div class="app-loading">
        <div class="lds-pacman">
          <div>
            <div></div>
            <div></div>
            <div></div>
          </div>
          <div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>
      <div class="app-loading">
        <div id="jhipster-error" style="display: none">
          <!--
            Shown by content/js/boot.js only if the bundle has not booted after four seconds.
            Without it a failed load is a blank page, indistinguishable from a slow one.

            KEEP id="jhipster-error" — boot.js:22 looks the element up by that id, and renaming it
            breaks the error path silently, with nothing failing to build.

            This text is deliberately English-only. It renders before Angular and ngx-translate
            boot, so no translation machinery exists yet to render a key; the <noscript> line below
            is English for the same reason. It is the one place the four-languages rule cannot
            apply. Keep it short, and keep it free of anything a signed-out visitor should not read.
          -->
          <h1 style="font-size: 20px; font-weight: 700; color: #0d3058">Abofonsa BridgeCare Professional</h1>
          <p style="margin-top: 12px; color: #4a5568">
            The portal could not finish loading. This is usually a temporary network problem — please refresh the page.
          </p>
          <p style="margin-top: 12px; color: #4a5568">If it keeps happening, contact your Abofonsa BridgeCare administrator.</p>
        </div>
      </div>
    </hpd-app>
    <noscript>
      <h1>You must enable JavaScript to view this page.</h1>
    </noscript>
    <!--
      Was an inline <script>. Moved to a file so a Content-Security-Policy of `script-src 'self'`
      can allow it: a policy strict enough to be worth setting blocks inline blocks, and the
      alternative — adding 'unsafe-inline' — gives up most of what the policy is for. See
      content/js/boot.js for what it does and why the ordering matters.
    -->
    <script src="content/js/boot.js"></script>
    <!-- Google Analytics: uncomment and change both instances of UA-XXXXX-X to be your site's ID.
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-XXXXX-X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'UA-XXXXX-X');
    </script>-->
  </body>
</html>
